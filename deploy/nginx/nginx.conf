# ==============================================================================
# RALT ONDC Logistics Provider (BPP) — Enterprise Nginx Configuration
# Production Hardening: Security Headers, WebSocket Upgrades, Rate Limiting & SSL
# ==============================================================================

# Rate limiting zone: 30 requests per second per IP
limit_req_zone $binary_remote_addr zone=ondc_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ralt.in www.ralt.in;

    # Allow ACME Challenge for Let's Encrypt / Certbot SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS in production
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ralt.in www.ralt.in;

    # SSL Certificates (managed via Certbot or custom bundle)
    ssl_certificate /etc/letsencrypt/live/ralt.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ralt.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Enterprise Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Real-time Fleet WebSocket Proxy (No timeout drops)
    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Strict Rate Limiting on OTP Endpoints
    location ~* ^/(api/auth/send-otp|api/rider/send-otp) {
        limit_req zone=otp_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Prometheus Scraper Metrics Endpoint
    location /metrics {
        proxy_pass http://127.0.0.1:5000/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. General API & ONDC Webhook Ingress
    location / {
        limit_req zone=ondc_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }
}
