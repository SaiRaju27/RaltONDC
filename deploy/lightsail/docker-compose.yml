name: ralt-ondc-lightsail

services:
  # ============================================================================
  # 1. Reverse Proxy & Ingress (Caddy v2 with Auto-SSL & Security Headers)
  # (Optional: host Nginx on Lightsail handles SSL for ralt.in)
  # ============================================================================
  caddy:
    image: caddy:2.7-alpine
    container_name: ralt-ondc-caddy
    restart: unless-stopped
    profiles:
      - caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_prod_data:/data
      - caddy_prod_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ralt-prod-net

  # ============================================================================
  # 2. RALT ONDC Logistics Provider (BPP) Backend
  # ============================================================================
  backend:
    image: ${BACKEND_IMAGE:-ralt-ondc-backend:latest}
    build:
      context: ../../services/ondc-lsp-service
      dockerfile: Dockerfile
    container_name: ralt-ondc-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ralt_ondc_db}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-ralt_ondc_jwt_production_secret_key_2026}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ralt-prod-net

  # ============================================================================
  # 3. PostgreSQL 16 + PostGIS Spatial Datastore
  # ============================================================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ralt-ondc-postgres-prod
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ralt_ondc_db}
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=4MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
    ports:
      - "127.0.0.1:5432:5432" # Bind only to localhost for security
    volumes:
      - ../../packages/database/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ralt-prod-net

  # ============================================================================
  # 4. Redis Geospatial Cache & Pub/Sub
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ralt-ondc-redis-prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ralt-prod-net

  # ============================================================================
  # 5. RabbitMQ Message Broker
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ralt-ondc-rabbitmq-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672" # Management UI accessible via SSH tunnel
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ralt-prod-net

networks:
  ralt-prod-net:
    driver: bridge

volumes:
  caddy_prod_data:
  caddy_prod_config:
  postgres_prod_data:
  redis_prod_data:
  rabbitmq_prod_data:

