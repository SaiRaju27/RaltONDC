version: 0.2

env:
  variables:
    NODE_ENV: "production"
    AWS_DEFAULT_REGION: "ap-south-1"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "=== Step 1: Installing monorepo dependencies ==="
      - export NODE_ENV=development
      - npm install --include=dev

  pre_build:
    commands:
      - echo "=== Step 2: Quality Gates (Lint, Scans, >=85% Coverage Tests) ==="
      - echo "Running static analysis and linting..."
      - npm run lint
      - echo "Running security audit, secret scans, and UI copy validation..."
      - npm run scan
      - echo "Running unit tests with 85%+ coverage thresholds..."
      - npm run test:coverage
      - echo "Building backend distribution..."
      - (cd services/ondc-lsp-service && npm run build)
      - echo "Quality gate validation passed successfully."

  build:
    commands:
      - echo "=== Step 3: Container Image Build ==="
      - docker build -t ralt-delivery-partner:latest -f services/ondc-lsp-service/Dockerfile services/ondc-lsp-service
      - docker tag ralt-delivery-partner:latest ralt-delivery-partner:$CODEBUILD_RESOLVED_SOURCE_VERSION || true
      - echo "Container build finished successfully on $(date)"

  post_build:
    commands:
      - echo "=== Step 4: Post-Build & CodeDeploy Readiness ==="
      - echo "Preparing CodeDeploy package for commit: $CODEBUILD_RESOLVED_SOURCE_VERSION"
      - chmod +x deploy/**/*.sh || true
      - chmod +x scripts/*.sh || true

artifacts:
  files:
    - 'appspec.yml'
    - 'docker-compose.yml'
    - 'deploy/**/*'
    - 'services/ondc-lsp-service/**/*'
    - 'packages/**/*'
    - 'package.json'
    - 'package-lock.json'
