name: CD - Enterprise Lightsail Production Deployment

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip quality gate tests (Emergency hotfix only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: lightsail-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  # ============================================================================
  # 1. Quality Gate (TypeScript Compilation & Static Analysis)
  # ============================================================================
  quality-gate:
    name: 🛡️ Quality Gate (Lint, Scans, >=85% Coverage Tests)
    runs-on: ubuntu-latest
    if: inputs.skip_tests != true
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ralt_ondc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm install --include=dev
        env:
          NODE_ENV: development

      - name: Run Complete Quality Gate
        run: npm run check:all

  # ============================================================================
  # 2. Parallel Docker Image Build & Push to GHCR
  # ============================================================================
  build-and-push:
    name: 🐳 Build & Publish Container to GHCR
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: always() && (needs.quality-gate.result == 'success' || needs.quality-gate.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ondc-lsp-service
          file: ./services/ondc-lsp-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Zero-Downtime Deployment to AWS Lightsail Host
  # ============================================================================
  deploy-to-lightsail:
    name: 🚀 SSH Zero-Downtime Rolling Deployment
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: success()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail_id_rsa
          chmod 600 ~/.ssh/lightsail_id_rsa
          ssh-keyscan -H -t rsa,ed25519 "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Synchronize Deployment Manifests to Lightsail
        run: |
          ssh -i ~/.ssh/lightsail_id_rsa -o StrictHostKeyChecking=no "${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }}" "mkdir -p /opt/ralt-ondc/deploy/lightsail/caddy /opt/ralt-ondc/packages/database"
          scp -i ~/.ssh/lightsail_id_rsa -o StrictHostKeyChecking=no packages/database/init-dbs.sql "${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/ralt-ondc/packages/database/init-dbs.sql"
          scp -i ~/.ssh/lightsail_id_rsa -o StrictHostKeyChecking=no deploy/lightsail/docker-compose.yml "${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/ralt-ondc/deploy/lightsail/docker-compose.yml"
          scp -i ~/.ssh/lightsail_id_rsa -o StrictHostKeyChecking=no deploy/lightsail/caddy/Caddyfile "${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/ralt-ondc/deploy/lightsail/caddy/Caddyfile"
          scp -i ~/.ssh/lightsail_id_rsa -o StrictHostKeyChecking=no deploy/lightsail/deploy-lightsail.sh "${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/ralt-ondc/deploy/lightsail/deploy-lightsail.sh"

      - name: Execute Deployment Runner with Auto-Rollback on Host
        run: |
          ssh -i ~/.ssh/lightsail_id_rsa -o StrictHostKeyChecking=no "${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }}" << 'EOF'
            set -e
            cd /opt/ralt-ondc
            chmod +x deploy/lightsail/deploy-lightsail.sh
            export REGISTRY="ghcr.io/${{ github.repository }}"
            export IMAGE_TAG="${{ github.sha }}"
            bash deploy/lightsail/deploy-lightsail.sh
          EOF
